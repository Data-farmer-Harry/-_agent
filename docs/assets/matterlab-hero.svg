<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MatterLab 研材体</title>
  <desc id="desc">An adaptive scientific agent for materials computation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#123b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="0.52" stop-color="#5ed3c6"/>
      <stop offset="1" stop-color="#9ee37d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#60d6c8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#60d6c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="95" r="220" fill="url(#glow)"/>
  <circle cx="110" cy="340" r="180" fill="url(#glow)" opacity=".5"/>

  <g opacity=".48" stroke="#a9efe6" stroke-width="2">
    <path d="M820 72 L905 120 L990 72 L1075 120 L1160 72"/>
    <path d="M820 170 L905 120 L990 170 L1075 120 L1160 170"/>
    <path d="M820 170 L905 218 L990 170 L1075 218 L1160 170"/>
    <path d="M820 268 L905 218 L990 268 L1075 218 L1160 268"/>
  </g>
  <g fill="#8be3d7" opacity=".92">
    <circle cx="820" cy="72" r="6"/><circle cx="905" cy="120" r="8"/>
    <circle cx="990" cy="72" r="5"/><circle cx="1075" cy="120" r="9"/>
    <circle cx="1160" cy="72" r="5"/><circle cx="820" cy="170" r="8"/>
    <circle cx="990" cy="170" r="10"/><circle cx="1160" cy="170" r="8"/>
    <circle cx="905" cy="218" r="6"/><circle cx="1075" cy="218" r="7"/>
    <circle cx="820" cy="268" r="5"/><circle cx="990" cy="268" r="8"/>
    <circle cx="1160" cy="268" r="6"/>
  </g>
  <g fill="#9aacff">
    <circle cx="905" cy="120" r="18" opacity=".12" filter="url(#shadow)"/>
    <circle cx="990" cy="170" r="22" opacity=".14" filter="url(#shadow)"/>
    <circle cx="1075" cy="120" r="20" opacity=".13" filter="url(#shadow)"/>
  </g>

  <text x="72" y="105" fill="#8be3d7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">MATERIALS COMPUTING AGENT</text>
  <text x="68" y="185" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="760">MatterLab</text>
  <rect x="72" y="207" width="570" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="255" fill="#d9e8f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500">研材体 · 面向材料计算的自适应科学 Agent</text>
  <text x="72" y="300" fill="#91a9bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">RAG · Dynamic Routing · MCP Tools · DAG Orchestration · Scientific Evaluation</text>
</svg>
