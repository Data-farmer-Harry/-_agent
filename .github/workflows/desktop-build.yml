name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS-arm64
            target: mac
          - os: windows-2025
            label: Windows
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_DESKTOP_BUILD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up desktop Conda runtime
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: desktop/environment.yml
          activate-environment: matterlab-desktop
          auto-activate-base: false

      - name: Install LAMMPS for macOS runtime
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: conda install -y -c conda-forge lammps

      - name: Install Python runtime dependencies
        shell: bash -el {0}
        run: python -m pip install -r backend/requirements/base.txt -r backend/requirements/visualization.txt

      - name: Stage official LAMMPS for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: desktop/scripts/prepare_windows_lammps.ps1

      - name: Install frontend and desktop dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Build desktop frontend
        shell: bash
        run: npm --prefix frontend run build

      - name: Validate backend and desktop launcher
        shell: bash -el {0}
        env:
          MATTERLAB_LAMMPS_ROOT: desktop/resources/lammps
        run: |
          python desktop/scripts/check_runtime.py
          (cd backend && python -m pytest tests/test_desktop_packaging.py tests/test_sandbox_runner.py -q)
          node --check desktop/main.mjs

      - name: Prepare icons and relocatable computation runtime
        shell: bash -el {0}
        run: |
          python desktop/scripts/build_icons.py
          python desktop/scripts/prepare_runtime.py

      - name: Build installer
        shell: bash
        run: npm --prefix desktop run dist:${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MatterLab-${{ matrix.label }}-${{ github.ref_name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
