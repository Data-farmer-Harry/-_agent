<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Simulation Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="icon-btn" id="menu-toggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <div class="sidebar-new-chat">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New chat
        </button>
      </div>
      <div class="history-list" id="history-container">
        <!-- History items -->
      </div>
      <div class="sidebar-footer">
        <button class="settings-btn" id="settings-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="main-header">
        <div class="header-title">
          <h1>MD Simulation</h1>
          <span class="version-tag">Agent v1.0</span>
        </div>
        <div class="header-status">
          <span class="status-badge hidden" id="app-status">连接失败</span>
        </div>
      </header>

      <div class="chat-container" id="chat-container">
        <!-- Initial Empty State -->
        <div class="empty-state" id="empty-state">
          <!-- Robot Agent Avatar -->
          <div class="robot-avatar">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.5"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
            <span style="color:#111827;">Robot Agent</span>
          </div>
          
          <!-- Mode Toggle -->
          <div class="mode-toggle">
            <button class="mode-btn active" id="mode-md">MD Simulation</button>
            <button class="mode-btn" id="mode-conv">Conversation</button>
          </div>

          <!-- Greetings -->
          <h2 class="greeting-title">你好，我是 MD Agent</h2>
          <p class="greeting-subtitle">有什么可以帮您模拟的吗？</p>

          <!-- Suggestions -->
          <div class="suggestion-grid">
            <button class="suggestion-card" data-query="请帮我做一个铝材料的平衡模拟，温度 500 K，步数 5000，用 EAM 势">
              <span class="icon">⚖️</span>
              <span class="text">快速平衡 (Al)</span>
            </button>
            <button class="suggestion-card" data-query="请帮我做一个铜材料的升温模拟，温度 900 K，步数 4000，用 EAM 势">
              <span class="icon">🔥</span>
              <span class="text">扩散轨迹 (Cu 升温)</span>
            </button>
            <button class="suggestion-card" data-query="请帮我做一个镍材料的平衡模拟，温度 700 K，步数 6000，用 EAM 势">
              <span class="icon">🧪</span>
              <span class="text">镍材料示例 (Ni)</span>
            </button>
            <button class="suggestion-card" data-query="EAM 和 LJ 势有什么区别？">
              <span class="icon">📘</span>
              <span class="text">势函数怎么选</span>
            </button>
          </div>
        </div>

        <!-- Chat Flow (Hidden by default) -->
        <div class="chat-flow hidden" id="chat-flow">
          <!-- Messages will be injected here -->
        </div>
      </div>

      <!-- Footer Input Area -->
      <div class="input-area-wrapper">
        <div class="input-box">
          <button class="icon-btn tool-btn" id="attachment-btn" title="Add attachment">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          </button>
          <button class="btn-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            Tools
          </button>
          
          <textarea id="user-input" placeholder="Ask Poros (MD Agent)..." rows="1"></textarea>
          
          <div class="input-actions-right">
            <button class="btn-text">
              Fast 
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <button class="icon-btn send-btn" id="send-btn" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
        <p class="footer-disclaimer">MD Simulation Agent 可能生成不准确的信息，请核对重要结果。</p>
      </div>

    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Environment Settings</h2>
        <button class="icon-btn" id="close-settings-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h3>LLM Configuration</h3>
          <div class="input-group">
            <label>Provider:</label>
            <input type="text" id="llm-provider" class="form-input">
          </div>
          <div class="input-group">
            <label>Base URL:</label>
            <input type="text" id="llm-base-url" class="form-input">
          </div>
          <div class="input-group">
            <label>Model:</label>
            <input type="text" id="llm-model" class="form-input">
          </div>
          <div class="input-group">
            <label>API Key:</label>
            <input type="password" id="llm-api-key" placeholder="Enter new to update, leave blank to keep" class="form-input">
          </div>
        </div>
        <div class="settings-section">
          <h3>LAMMPS Configuration</h3>
          <div class="input-group">
            <label>LAMMPS Command:</label>
            <input type="text" id="lammps-cmd" class="form-input">
          </div>
          <div class="input-group">
            <label>Potentials Dir:</label>
            <input type="text" id="potentials-dir" class="form-input">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-text" id="cancel-settings-btn">Cancel</button>
        <button class="btn-primary" id="save-settings-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
